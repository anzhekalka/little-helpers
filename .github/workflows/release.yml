name: Build app

# Builds "Little Helpers.app" on a Mac in the cloud.
# Every push to main builds the app and publishes (or updates) the release
# named after the number in the VERSION file, e.g. 1.0 -> v1.0.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for Apple silicon and Intel
        run: |
          set -e
          APP="Little Helpers.app"
          mkdir -p "build/$APP/Contents/MacOS"
          cp Info.plist "build/$APP/Contents/Info.plist"
          swiftc -O -swift-version 5 -target arm64-apple-macos11 LittleHelpers.swift \
            -o build/lh-arm64 -framework AppKit
          swiftc -O -swift-version 5 -target x86_64-apple-macos11 LittleHelpers.swift \
            -o build/lh-x86_64 -framework AppKit
          lipo -create build/lh-arm64 build/lh-x86_64 \
            -output "build/$APP/Contents/MacOS/LittleHelpers"
          codesign --force --sign - "build/$APP"
          cd build && ditto -c -k --keepParent "$APP" ../LittleHelpers-mac.zip

      - name: Smoke test (launch, watch the cat, open the menu)
        run: |
          mkdir -p shots
          open "build/Little Helpers.app"
          sleep 4
          screencapture -x shots/1-hello-cat.png
          sleep 3
          screencapture -x shots/2-cat-running.png
          pgrep -x LittleHelpers >/dev/null || { echo "The app is not running after launch."; exit 1; }
          echo "The app launched and is still running."
          clicked=no
          for bar in 1 2; do
            if osascript -e "tell application \"System Events\" to tell process \"LittleHelpers\" to click menu bar item 1 of menu bar $bar"; then
              echo "Clicked the paw icon (menu bar $bar)."
              clicked=yes
              break
            fi
          done
          [ "$clicked" = yes ] || echo "Could not click the paw icon on this machine."
          sleep 2
          screencapture -x shots/3-menu.png
          pgrep -x LittleHelpers >/dev/null || { echo "The app stopped after opening the menu."; exit 1; }
          echo "The app is still running after opening the menu."

      # Screenshots go into a private draft release (only the owner can see drafts).
      - name: Save the screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: test-${{ github.run_number }}
          name: Test screenshots ${{ github.run_number }}
          files: shots/*.png

      - name: Read the version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LittleHelpers-mac
          path: LittleHelpers-mac.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Little Helpers ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: LittleHelpers-mac.zip
          body: |
            Pixel pets that run across your Mac with gentle reminders <3

            **How to install**
            1. Download `LittleHelpers-mac.zip` below and double-click it.
            2. Drag **Little Helpers** into your **Applications** folder and open it.
            3. macOS will warn you that it cannot check the app (it is free and not registered with Apple).
               Click **Done**, then open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
            4. Look for the 🐾 paw in your menu bar.

            Works on Apple silicon and Intel Macs with macOS 11 or later.
