name: Build app

# Builds "Little Helpers.app" on a Mac in the cloud.
# Every push builds and tests the app. Only pushes to main publish (or update)
# the release named after the number in the VERSION file, e.g. 1.0 -> v1.0.
on:
  push:
    branches-ignore: [test-screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for Apple silicon and Intel
        run: |
          set -e
          APP="Little Helpers.app"
          mkdir -p "build/$APP/Contents/MacOS"
          cp Info.plist "build/$APP/Contents/Info.plist"
          swiftc -O -swift-version 5 -target arm64-apple-macos11 LittleHelpers.swift \
            -o build/lh-arm64 -framework AppKit
          swiftc -O -swift-version 5 -target x86_64-apple-macos11 LittleHelpers.swift \
            -o build/lh-x86_64 -framework AppKit
          lipo -create build/lh-arm64 build/lh-x86_64 \
            -output "build/$APP/Contents/MacOS/LittleHelpers"
          codesign --force --sign - "build/$APP"
          cd build && ditto -c -k --keepParent "$APP" ../LittleHelpers-mac.zip

      - name: Smoke test (launch, watch the cat, open the menu)
        run: |
          mkdir -p shots
          open "build/Little Helpers.app"
          sleep 4
          screencapture -x shots/1-hello-cat.png
          sleep 3
          screencapture -x shots/2-cat-running.png
          pgrep -x LittleHelpers >/dev/null || { echo "The app is not running after launch."; exit 1; }
          echo "The app launched and is still running."
          clicked=no
          for bar in 1 2; do
            if osascript -e "tell application \"System Events\" to tell process \"LittleHelpers\" to click menu bar item 1 of menu bar $bar"; then
              echo "Clicked the paw icon (menu bar $bar)."
              clicked=yes
              break
            fi
          done
          [ "$clicked" = yes ] || echo "Could not click the paw icon on this machine."
          sleep 2
          screencapture -x shots/3-menu.png
          pgrep -x LittleHelpers >/dev/null || { echo "The app stopped after opening the menu."; exit 1; }
          echo "The app is still running after opening the menu."

      - name: Task notes test (demo tasks, click the pet, "later", tasks page)
        run: |
          cat > click.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let a = CommandLine.arguments
          let p = CGPoint(x: Double(a[1])!, y: Double(a[2])!)
          CGEvent(mouseEventSource: nil, mouseType: .mouseMoved, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
          usleep(100000)
          for type in [CGEventType.leftMouseDown, .leftMouseUp] {
              CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
              usleep(80000)
          }
          SWIFT
          swiftc click.swift -o click
          pkill -x LittleHelpers || true
          sleep 1
          rm -f /tmp/lh-demo.txt
          open "build/Little Helpers.app" --args --demo
          sleep 1.1
          screencapture -x shots/4-note-popping-in.png
          sleep 3
          screencapture -x shots/5-first-note.png
          cat /tmp/lh-demo.txt || echo "No position file."
          pet=$(grep '^pet' /tmp/lh-demo.txt | cut -d' ' -f2-)
          ./click $pet
          sleep 0.35
          screencapture -x shots/6-clicked-pet-cheers.png
          sleep 4
          screencapture -x shots/7-second-note.png
          later=$(grep '^later' /tmp/lh-demo.txt | cut -d' ' -f2-)
          ./click $later
          sleep 2.5
          screencapture -x shots/8-after-later.png
          osascript -e 'tell application "System Events" to tell process "LittleHelpers" to click menu bar item 1 of menu bar 1' || true
          sleep 2
          screencapture -x shots/9-tasks-page.png
          ./click 653 358
          sleep 1
          osascript -e 'tell application "System Events" to keystroke "9:30 buy milk"' || true
          sleep 1
          screencapture -x shots/10-typing-a-task.png
          osascript -e 'tell application "System Events" to key code 36' || true
          sleep 1
          screencapture -x shots/11-task-added.png
          pgrep -x LittleHelpers >/dev/null || { echo "The app stopped during the task notes test."; exit 1; }
          echo "The app is still running after the task notes test."

      - name: Save the screenshots to the test-screenshots branch
        if: always() && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cp LittleHelpers-mac.zip shots/ 2>/dev/null || true     # the test build, for trying it out
          cd shots
          git init -q
          git checkout -q -b test-screenshots
          git add .
          git -c user.name="test robot" -c user.email="actions@github.com" commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-screenshots

      - name: Read the version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LittleHelpers-mac
          path: LittleHelpers-mac.zip

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Little Helpers ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: LittleHelpers-mac.zip
          body: |
            Pixel pets that run across your Mac with gentle reminders <3

            **New in 1.1:** task notes. Plan your day, and a pet pops up in the corner with your list at the right time.

            **How to install**
            1. Download `LittleHelpers-mac.zip` below and double-click it.
            2. Drag **Little Helpers** into your **Applications** folder and open it.
            3. macOS will warn you that it cannot check the app (it is free and not registered with Apple).
               Click **Done**, then open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
            4. Look for the 🐾 paw in your menu bar.

            Works on Apple silicon and Intel Macs with macOS 11 or later.
